name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Buscar credenciales y archivos sensibles
        run: bash scripts/verificar_secretos.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint con Ruff
        run: pip install ruff && ruff check backend/
