<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso · AlertAR</title><link rel="stylesheet" href="{{ url_for('static',filename='panel.css') }}"></head>
<body><main class="login"><p class="marca">AlertAR <span>CONTROL DE PASOS</span></p><section class="card"><h1>Acceso al monitoreo</h1><p>Estado del túnel e historial de mediciones. Acceso de solo lectura.</p><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="clave">Clave de acceso</label><input id="clave" name="clave" type="password" maxlength="256" required autocomplete="current-password">{% if error %}<p role="alert" class="error">{{ error }}</p>{% endif %}<button type="submit">Ingresar al panel</button></form><p class="muted">La clave no se guarda en el navegador. La sesión vence a las 8 horas.</p></section></main></body></html>
