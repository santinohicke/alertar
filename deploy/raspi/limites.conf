[Service]
ExecStart=
ExecStart=/opt/alertar/venv/bin/uvicorn gateway:app --host 127.0.0.1 --port 8000 --workers 1 --limit-concurrency 8 --backlog 16 --timeout-keep-alive 30 --no-access-log
Environment=ALERTAR_REQUIRE_AUTH=1
EnvironmentFile=-/etc/alertar-device.env
MemoryAccounting=true
MemoryHigh=96M
MemoryMax=144M
CPUAccounting=true
CPUQuota=75%
TasksMax=32
Restart=on-failure
RestartSec=5
